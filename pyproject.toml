[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cloudflare-mcp-zero-trust"
version = "0.1.0"
description = "Cloudflare Access Managed OAuth and origin verification for MCP servers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cloudflare MCP Zero Trust contributors" }]
dependencies = [
  "fastmcp>=3.4,<5",
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.10,<3",
  "starlette>=1,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.10,<2.11",
  "pyright>=1.1.411,<1.2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.15.20,<0.16",
]

[project.scripts]
cf-mcp-zero-trust = "cloudflare_mcp_zero_trust.cli:app"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src/cloudflare_mcp_zero_trust"]
